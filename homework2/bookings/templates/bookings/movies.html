{% extends "bookings/base.html" %}
{% load static %}
{% block title %}Movies{% endblock %}
{% block extra_head %}
    <style> 
        body { 
        font-family: Arial, sans-serif;
        margin: 0; padding: 20px;
        background: #f5f5f5;
        }
        header { 
        display: flex;
        justify-content: space-between;
        align-items: center; margin-bottom: 25px;
        } 
        header h1 { 
            margin: 0;
        } 
        movie-list { display: flex;
        flex-direction: column;
        gap: 20px;
        } 
        movie-card { background: white;
        padding: 15px;
        border-radius: 8px;
        display: flex;
        gap: 15px;
        align-items: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        } 
        movie-card img { width: 120px;
        height: 170px;
        object-fit: cover;
        background: #ddd;
        border-radius: 6px;
        } 
        movie-info { 
            flex: 1;
            } 
        movie-info h2 { margin: 0 0 8px 0;
        font-size: 20px;
        }
        movie-info p { margin: 4px 0;
        color: #444;
        }
        book-btn { padding: 10px 18px;
        background: #0077ff;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 15px;
        }
        book-btn:hover { background: #005fcc;
        } 
    </style>
{% endblock %}

{% block content %}
    <h1> MOVIES </h1>
{% endblock %}
